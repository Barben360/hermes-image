# Embedded defaults of morning-brief. The owner's file holds only overrides.
# Sections' own defaults live in their Go code (see `morning-brief sections`).
writer:
  language: fr
  # the spec's order; sections not listed print after these, alphabetically
  order: [weather, calendar, car, robot, sensors, energy, home, alerts, expiries, mail, github, deepseek, bugsink, pet_feeder, presence, tech_radar]
  notes: ""
sources:
  ha_url: ha.bbarrois.tech
  grafana_url: http://grafana:3000
  pcb_url: https://proton-calendar-bridge:1080/mcp
  pcb_ca: /etc/hermes-ca/pcb.pem
  imap_config: /etc/himalaya/config.toml
  bugsink_url: http://bugsink:8000
  bugsink_host: erreurs.infirlib.fr
  vault_dir: /opt/vault
  cron_jobs: /opt/data/cron/jobs.json
